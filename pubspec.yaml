name: ahmed_saad_community
description: Ahmed Saad Community chat with offline Base64 voice messages.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_database: ^11.1.6
  shared_preferences: ^2.3.3
  flutter_sound: ^9.28.0
  audioplayers: ^6.1.0
  device_info_plus: ^11.1.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
